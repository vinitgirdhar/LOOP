services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: loop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: loop
      POSTGRES_DB: loop
    ports:
      - "5433:5432"
    volumes:
      - loop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: loop-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - loop-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  loop-pgdata:
  loop-redisdata:
