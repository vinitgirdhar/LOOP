project_id = "loop"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# One page of a board or a channel. Anything larger is a report, not a screen.
max_rows = 200

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

# Catches outbound mail locally so the verification and invite flows can be
# walked end to end without a provider.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "25MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://loop.vercel.app/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# A stolen refresh token is detected on reuse and revokes the family — the same
# guarantee the old Express implementation gave, now handled by the platform.
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = "http://localhost:54321/auth/v1/callback"

[realtime]
enabled = true
